name: Backend CI (.NET 8)

on:
  push:
    branches: [ main, 'feature/*', 'member-*/*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/FixFlow.Api/FixFlow.Api.csproj

      - name: Build Web API
        run: dotnet build backend/FixFlow.Api/FixFlow.Api.csproj --no-restore

      - name: Run Backend Tests
        run: dotnet test backend/FixFlow.Tests/FixFlow.Tests.csproj --no-build
